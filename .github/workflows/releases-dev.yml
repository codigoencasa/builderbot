name: 🚀 (DEV) Liberando versiones

on:
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'Dry run: valida auth y muestra qué se publicaría, sin versionar ni publicar'
                required: false
                default: false
                type: boolean
    pull_request:
        branches:
            - builderbot-dev

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: 22.20.0
    PUPPETEER_SKIP_DOWNLOAD: 'true'
    PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
    PUPPETEER_SKIP_FIREFOX_DOWNLOAD: 'true'
    MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries

jobs:
    ############ TEST ############
    test:
        name: 🧪 Tests
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - name: Cache heavy binaries
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/puppeteer
                      ~/.cache/mongodb-binaries
                  key: heavy-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: heavy-binaries-${{ runner.os }}-

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'pnpm'
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile --prefer-offline --reporter=append-only

            - name: Run Tests
              run: pnpm test

    ############ BUILD ############
    build:
        name: 🔨 Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - name: Cache heavy binaries
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/puppeteer
                      ~/.cache/mongodb-binaries
                  key: heavy-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: heavy-binaries-${{ runner.os }}-

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'pnpm'
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile --prefer-offline --reporter=append-only

            - name: Build Packages
              run: pnpm run clean.lib && pnpm run build

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: dist-packages
                  path: packages/*/dist
                  retention-days: 1

    ############ FORK NOTICE ############
    # GitHub no comparte los secrets con los PRs de forks, así que publicar una
    # alpha es imposible en ese caso. En lugar de fallar en rojo, lo omitimos y
    # lo explicamos (el resto del pipeline — tests y build — sí corre).
    fork-notice:
        name: ℹ️ Fork sin secrets
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        runs-on: ubuntu-latest
        steps:
            - name: Explain why the alpha release is skipped
              run: |
                  echo "::notice::PR desde un fork: se omite la publicación de la alpha porque GitHub no expone los secrets (NPM_TOKEN) a los forks. Los tests y el build sí se ejecutan."

    ############ RELEASE ############
    release:
        name: 📦 Release Alpha
        runs-on: ubuntu-latest
        needs: [test, build]
        # Los PRs de forks no reciben secrets → no se puede autenticar ni publicar.
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        permissions:
            contents: write
            packages: write
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.head_ref || github.ref_name }}

            - uses: pnpm/action-setup@v4

            - name: Cache heavy binaries
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/puppeteer
                      ~/.cache/mongodb-binaries
                  key: heavy-binaries-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
                  restore-keys: heavy-binaries-${{ runner.os }}-

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: 'pnpm'
                  cache-dependency-path: pnpm-lock.yaml
                  registry-url: 'https://registry.npmjs.org'

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile --prefer-offline --reporter=append-only

            - name: Download build artifacts
              uses: actions/download-artifact@v4
              with:
                  name: dist-packages
                  path: packages

            - name: Verify npm authentication
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  if [ -z "$NODE_AUTH_TOKEN" ]; then
                      echo "::error::Falta el secret NPM_TOKEN. Añádelo en Settings → Secrets and variables → Actions."
                      exit 1
                  fi
                  if ! npm whoami >/dev/null 2>&1; then
                      echo "::error::NPM_TOKEN inválido o expirado (401 Unauthorized)."
                      echo "::error::Genera un token nuevo en https://www.npmjs.com/settings/~/tokens (tipo 'Automation', que omite el 2FA) y actualiza el secret NPM_TOKEN."
                      exit 1
                  fi
                  echo "✅ Autenticado en npm como: $(npm whoami)"

            - name: Configure Git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Dry run — reportar la versión y qué se publicaría
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  BASE_VERSION=$(node -p "require('./lerna.json').version.replace(/-alpha.*/, '')")
                  NEW_VERSION="${BASE_VERSION}-alpha.${{ github.run_number }}"
                  echo "DRY RUN — no se versionará ni publicará nada"
                  echo "📦 Versión que se publicaría: ${NEW_VERSION} (dist-tag: alpha)"
                  echo "📋 Paquetes (versión actual → versión de la alpha):"
                  NEW_VERSION="$NEW_VERSION" node - <<'NODE'
                  const { execSync } = require('node:child_process')
                  const pkgs = JSON.parse(execSync('npx lerna ls --json', { encoding: 'utf8' }))
                  for (const p of pkgs) console.log(`   - ${p.name}: ${p.version} → ${process.env.NEW_VERSION}`)
                  console.log(`\nTotal: ${pkgs.length} paquetes se publicarían como ${process.env.NEW_VERSION}`)
                  NODE

            - name: Release Alpha
              if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
              run: |
                  # Obtener versión base sin sufijo alpha
                  BASE_VERSION=$(node -p "require('./lerna.json').version.replace(/-alpha.*/, '')")
                  NEW_VERSION="${BASE_VERSION}-alpha.${{ github.run_number }}"
                  echo "📦 Publicando versión: $NEW_VERSION"

                  # Actualizar versión en todos los paquetes
                  npx lerna version $NEW_VERSION --force-publish --yes --no-git-tag-version --no-push

                  # Hacer commit temporal de los cambios de versión (necesario para lerna publish)
                  git add -A
                  git commit -m "chore: bump version to $NEW_VERSION [skip ci]" || true

                  # Publicar al tag alpha
                  npx lerna publish from-package --dist-tag alpha --yes
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: 📋 Log Deployed Version
              if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
              run: |
                  echo "=========================================="
                  echo "🚀 VERSIÓN DESPLEGADA (ALPHA)"
                  echo "=========================================="
                  echo "📅 Fecha: $(date)"
                  echo "🔗 Commit: ${{ github.sha }}"
                  echo "👤 Actor: ${{ github.actor }}"
                  echo "------------------------------------------"
                  echo "📦 Paquetes publicados:"
                  npx lerna ls --json | jq -r '.[] | "  - \(.name): \(.version)"'
                  echo "=========================================="
